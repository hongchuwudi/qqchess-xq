directories:
  output: dist
  buildResources: build
appId: com.qqchess.proxy
productName: QQ象棋协议分析器
extraResources:
  - from: ../engines
    to: engines
  - from: ../xq_ws_proxy.py
    to: xq_ws_proxy.py
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
mac:
  target: dmg
  artifactName: ${productName}_${version}_mac.${ext}
linux:
  target: AppImage
  artifactName: ${productName}_${version}_linux.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: ${productName}_${version}_portable.${ext}
files:
  - filter:
      - main.js
      - preload.js
      - pikafish-bridge.js
      - renderer.js
      - index.html
      - style.css
electronVersion: 39.8.10
